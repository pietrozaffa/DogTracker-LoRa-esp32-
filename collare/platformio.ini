; ============================================================
;  COLLARE GPS-LoRa - PlatformIO config
;
;  DUE AMBIENTI: scegli quello della tua scheda.
;    pio run -e collare_v4    (Heltec V4 — 16MB flash, PA esterno)
;    pio run -e collare_v3    (Heltec V3 — 8MB flash)
;
;  Il collare non usa WiFi/LittleFS, quindi la partizione di default
;  basta e avanza: nessuna tabella custom necessaria.
;
;  NOTA POTENZA su V4: la scheda ha un amplificatore esterno (+6/7 dB).
;  Vedi il commento su LORA_PWR_DBM in src/main.cpp per il calcolo ERP.
; ============================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = heltec_wifi_lora_32_V3
lib_deps =
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3
    electroniccats/MPU6050@^1.3.1

[env:collare_v4]
board_upload.flash_size = 16MB
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_V4
    -D RADIOLIB_LOW_LEVEL=1

[env:collare_v3]
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
