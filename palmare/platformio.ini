; ============================================================
;  PALMARE GPS-LoRa - PlatformIO config
;
;  DUE AMBIENTI: scegli quello della tua scheda.
;    pio run -e palmare_v4    (Heltec V4 — ESP32-S3R2, 16MB flash, 2MB PSRAM)
;    pio run -e palmare_v3    (Heltec V3 — ESP32-S3FN8, 8MB flash, NO PSRAM)
;  In VS Code/PlatformIO l'ambiente si sceglie dalla barra in basso.
;
;  Display: Waveshare 2.42" OLED 128x64 SSD1309
;  Input:   Encoder rotativo KY-040 con pulsante
;  Bussola: QMC5883L (o integrata nel modulo GPS "M8N + compass")
;
;  PERCHE' SERVE UNA TABELLA PARTIZIONI CUSTOM
;  Il palmare usa WiFi + WebServer (pagina mappa) + LittleFS (tracce).
;  Con la partizione di default (1.3 MB app) il firmware NON CI ENTRA.
;  Occupazione stimata: ~950 KB con USE_BLE 0, ~1.9 MB con USE_BLE 1.
;
;  ARDUINO IDE: il .csv non viene letto, imposta a mano
;  Tools > Partition Scheme > "Huge APP (3MB No OTA/1MB SPIFFS)"
;  e (solo V4) Tools > PSRAM > "QSPI PSRAM".
; ============================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.9
    mprograms/QMC5883LCompass@^1.2.3

; ---------------- HELTEC V4 (consigliato) --------------------
; ESP32-S3R2: 2 MB di PSRAM QUAD (non octal). Importante: la PSRAM
; octal userebbe i GPIO 33-37, che noi usiamo per GPS/Vext/ADC —
; con la quad restano liberi, nessun conflitto.
; Con PSRAM attiva il buffer tracce passa da 300 a 5000 punti/cane.
[env:palmare_v4]
board = heltec_wifi_lora_32_V3      ; profilo V3: stessi pin, va bene per la V4
board_build.partitions = partitions_pizaff_16mb.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D BOARD_V4
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D RADIOLIB_LOW_LEVEL=1

; ---------------- HELTEC V3 ----------------------------------
; ESP32-S3FN8: 8 MB flash, NESSUNA PSRAM.
; Il firmware lo rileva da solo e riduce il buffer tracce a 300
; punti/cane in RAM interna (lo storico completo resta su LittleFS).
[env:palmare_v3]
board = heltec_wifi_lora_32_V3
board_build.partitions = partitions_pizaff.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
