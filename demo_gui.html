<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pi_Zaff DogTrack v2.14 — DEMO GUI</title>
<style>
:root{--bg:#101418;--fg:#e8edf2;--acc:#3ba55d;--warn:#e5a53a;--bad:#d9534f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#top{padding:8px 12px;display:flex;align-items:center;gap:8px;background:#171d24;flex-wrap:wrap}
#top h1{font-size:15px;font-weight:600;flex:1;min-width:80px;display:flex;align-items:center;gap:8px}
#demoBadge{font-size:10px;letter-spacing:.06em;font-weight:700;background:var(--warn);color:#1a1300;border-radius:4px;padding:2px 6px}
#st{font-size:12px;color:var(--acc)}
#mapSelect{background:#2a3542;color:var(--fg);border:1px solid #3a4552;border-radius:4px;padding:4px 6px;font-size:11px}
#settingsBtn,#trailBtn{background:#2a3542;color:var(--fg);border:0;border-radius:6px;padding:5px 9px;font-size:12px}
#map{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;background:#0b0e12;touch-action:none}
#map.dragging{cursor:grabbing}
#mosaic{position:absolute;width:768px;height:768px;left:0;top:0}
#mosaic img{position:absolute;width:256px;height:256px;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.dogPin{position:absolute;pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px}
.dogPin .lbl{font-size:10px;font-weight:700;background:#171d24ee;color:#e8edf2;padding:1px 5px;border-radius:4px;white-space:nowrap}
.dogPin .dot{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.mePin{position:absolute;pointer-events:none;width:24px;height:24px;transform:translate(-50%,-50%)}
.me-arrow{width:24px;height:24px;transform-origin:50% 50%}
#mapAttrib{position:absolute;right:6px;bottom:4px;font-size:9px;color:#c7d0da;background:#00000099;padding:2px 6px;border-radius:4px;pointer-events:none}
#mapHint{position:absolute;left:6px;bottom:4px;font-size:9px;color:#c7d0da;background:#00000099;padding:2px 6px;border-radius:4px;pointer-events:none}
#cards{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#171d24}
.card{min-width:130px;background:#1f2833;border-radius:10px;padding:8px 10px;flex-shrink:0;border:2px solid transparent;-webkit-tap-highlight-color:transparent}
.card.act{border-color:var(--acc);background:#24352c}
.card .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.card .dist{font-size:20px;font-weight:800;margin:2px 0}
.card .sub{font-size:11px;color:#9fb0c0}
.arrow{display:inline-block;width:14px;height:14px}
.old{color:var(--warn)}.lost{color:var(--bad);animation:bl 1s infinite}
.ferma{color:var(--bad);font-weight:700;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.bz{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block}
.bz.mv{background:var(--warn)}
.sig{display:inline-flex;align-items:flex-end;gap:1px;margin-left:auto;height:13px}
.sig i{width:3px;background:#3a4756;border-radius:1px;display:block}
.sig i.on{background:var(--acc)}
.infoBtn{width:16px;height:16px;border-radius:50%;background:#2a3542;color:#9fb0c0;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:0;cursor:pointer;font-family:inherit;padding:0}
.gps{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px 1px 4px;border-radius:8px}
.gps svg{flex-shrink:0}
.gps.gok{background:#1c3b26;color:var(--acc)}
.gps.gok svg{fill:var(--acc);stroke:var(--acc)}
.gps.gpart{background:#3a2e18;color:var(--warn)}
.gps.gpart svg{fill:var(--warn);stroke:var(--warn)}
.gps.gbad{background:#3a2020;color:var(--bad)}
.gps.gbad svg{fill:var(--bad);stroke:var(--bad)}
.batt{display:inline-flex;align-items:center;gap:3px;font-size:11px}
.batt svg{flex-shrink:0}
.batt.bok{color:var(--acc)}
.batt.bwarn{color:var(--warn)}
.batt.bbad{color:var(--bad)}
.batt svg rect{fill:currentColor}
.batt svg rect:first-child{fill:none;stroke:currentColor;stroke-width:1}
#trk{background:#171d24;padding:6px 12px;font-size:13px}
#trk summary{cursor:pointer;color:#9fb0c0;padding:4px 0}
.trow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #232d38}
.trow .ti{flex:1}.trow .td{font-size:11px;color:#9fb0c0}
.trow a,.trow button{background:#2a3542;color:#e8edf2;border:0;border-radius:6px;padding:5px 10px;font-size:12px;text-decoration:none;cursor:pointer}
.trow button.del{background:#5a2b2b}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center}
#modal.show{display:flex}
#modalContent{background:#1f2833;border-radius:12px;padding:20px;width:88%;max-width:340px;max-height:80vh;overflow-y:auto}
#modalContent h2{margin-bottom:14px;color:var(--acc);font-size:16px}
.settingRow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a3542;gap:10px}
.settingRow:last-child{border-bottom:none}
.settingRow label{font-size:12px;color:#9fb0c0}
.settingRow input,.settingRow select{background:#2a3542;border:1px solid #3a4552;color:var(--fg);border-radius:4px;padding:5px 6px;font-size:12px;width:110px}
#calibBtn{width:auto;background:var(--warn);color:#000;font-weight:600;border:0;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
#calibStatus{font-size:11px;color:var(--acc);margin-top:6px;min-height:14px}
#modalBtns{display:flex;gap:10px;margin-top:15px;justify-content:flex-end}
#modalBtns button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 15px;font-size:12px;cursor:pointer}
#modalBtns button.cancel{background:#2a3542;color:var(--fg)}
#infoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center}
#infoModal.show{display:flex}
#infoModalContent{background:#1f2833;border-radius:12px;padding:20px;width:88%;max-width:340px;max-height:80vh;overflow-y:auto}
#infoModalContent h2{margin-bottom:14px;color:var(--acc);font-size:16px}
.infoRow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2a3542;font-size:13px;gap:10px}
.infoRow:last-child{border-bottom:none}
.infoRow span:first-child{color:#9fb0c0}
.infoRow span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
#infoModalClose{width:100%;margin-top:15px;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px;font-size:13px;cursor:pointer}
</style></head><body>
<div id="top">
  <h1>Pi_Zaff DogTrack <small style="font-size:10px;font-weight:400;color:#9fb0c0">v2.14</small> <span id="demoBadge">DEMO</span></h1>
  <span id="st">connessione...</span>
  <select id="mapSelect">
    <option value="street">Mappa</option>
    <option value="sat">Satellite</option>
    <option value="topo">Topo</option>
  </select>
  <button id="trailBtn">Trail OFF</button>
  <button id="settingsBtn">⚙</button>
</div>
<div id="map">
  <div id="mosaic"></div>
  <svg id="overlay"></svg>
  <div id="mapHint">trascina per muovere la vista</div>
  <div id="mapAttrib"></div>
</div>
<div id="cards"></div>
<details id="trk"><summary>Tracce salvate</summary><div id="trklist">...</div></details>

<div id="modal">
  <div id="modalContent">
    <h2>Impostazioni</h2>
    <div class="settingRow">
      <label>Unità di misura</label>
      <select id="setMetric">
        <option value="1">Metrico (km)</option>
        <option value="0">Imperiale (mi)</option>
      </select>
    </div>
    <div class="settingRow">
      <label>Declinazione (°)</label>
      <input type="number" id="setDecl" step="0.1" min="-180" max="180">
    </div>
    <div class="settingRow">
      <label>Bussola</label>
      <button id="calibBtn">Calibra</button>
    </div>
    <div id="calibStatus"></div>
    <div id="modalBtns">
      <button class="cancel" id="modalCancel">Annulla</button>
      <button id="modalSave">Salva</button>
    </div>
  </div>
</div>
<div id="infoModal">
  <div id="infoModalContent">
    <h2 id="infoModalTitle">Info</h2>
    <div id="infoModalBody"></div>
    <button id="infoModalClose">Chiudi</button>
  </div>
</div>

/* ======================================================================
   DEMO GUI — replica della pagina servita dal palmare (MAP_HTML in
   src/main.cpp). fetch('/data'|'/getsettings'|'/settings'|'/calibrate'
   |'/tracks'|'/gpx') sono sostituite da un simulatore locale che muove
   3 cani finti intorno a Vico del Gargano.

   MAPPE: qui sotto (TILE_DATA) ci sono 27 tile reali (street/CARTO,
   satellite/Esri, topo/OpenTopoMap) intorno a Vico del Gargano,
   scaricate una volta e incorporate in base64 cosi' la demo funziona
   offline. Sul palmare vero le tile le scarica il TELEFONO in tempo
   reale dal proprio browser (il palmare fa solo da web server locale,
   non da proxy) — qui invece sono precaricate per poterle vedere anche
   senza accesso a internet dal punto in cui apri questa pagina.
   ====================================================================== */

const CENTER = {lat: 41.8983440, lon: 15.9575540}; // Vico del Gargano
const POS_SPEEDUP = 2.4;
let simT = 0;
let cfg = {metric: true, decl: 3.2};

function haversineM(lat1,lon1,lat2,lon2){
 const R=6371000, toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearingDeg(lat1,lon1,lat2,lon2){
 const toRad=x=>x*Math.PI/180, toDeg=x=>x*180/Math.PI;
 const y=Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
 const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
 return (toDeg(Math.atan2(y,x))+360)%360;
}
function metersToLatLon(lat0,lon0,north,east){
 return {lat: lat0+north/111320, lon: lon0+east/(111320*Math.cos(lat0*Math.PI/180))};
}

const meSim = {angle:0, omega:0.006, R:18, lat:CENTER.lat, lon:CENTER.lon, head:0};

const dogsSim = [
 {name:'Rex',  R0:110, R1:35, omega:0.030, phase:0.0, battery:91, rssiBase:-68, satsBase:9, altBase:245, connected:()=>true,
  lat:0, lon:0, prevLat:0, prevLon:0, spd:0, lastRxMs:Date.now(), history:[], recent:[], sats:0, fix:false, snr:0, hdop:0, ferma:false, alt:0},
 {name:'Luna', R0:230, R1:70, omega:0.021, phase:2.1, battery:74, rssiBase:-88, satsBase:7, altBase:180,
  connected:(realT)=>{const c=realT%50; return !(c>32&&c<44);},
  lat:0, lon:0, prevLat:0, prevLon:0, spd:0, lastRxMs:Date.now(), history:[], recent:[], sats:0, fix:false, snr:0, hdop:0, ferma:false, alt:0},
 {name:'Fido', R0:380, R1:120, omega:0.014, phase:4.3, battery:52, rssiBase:-104, satsBase:3, altBase:510,
  connected:(realT)=>{const c=realT%140; return !(c>55&&c<130);},
  // pochi satelliti base: mostra apposta lo stato "sats>0 ma niente fix"
  lat:0, lon:0, prevLat:0, prevLon:0, spd:0, lastRxMs:Date.now(), history:[], recent:[], sats:0, fix:false, snr:0, hdop:0, ferma:false, alt:0},
];
const t0Real = Date.now();

function stepSim(){
 const realT = (Date.now()-t0Real)/1000;
 simT += 2*POS_SPEEDUP;

 const prevMe = {lat:meSim.lat, lon:meSim.lon};
 meSim.angle += meSim.omega*2*POS_SPEEDUP;
 const mp = metersToLatLon(CENTER.lat, CENTER.lon, meSim.R*Math.cos(meSim.angle), meSim.R*Math.sin(meSim.angle));
 meSim.lat = mp.lat; meSim.lon = mp.lon;
 if (haversineM(prevMe.lat,prevMe.lon,meSim.lat,meSim.lon) > 0.3) {
   meSim.head = bearingDeg(prevMe.lat,prevMe.lon,meSim.lat,meSim.lon);
 }

 dogsSim.forEach((d,i)=>{
   d.prevLat = d.lat || meSim.lat; d.prevLon = d.lon || meSim.lon;
   const speedFactor = Math.max(0, Math.sin(simT*0.05 + d.phase));
   d.angle = (d.angle||d.phase) + d.omega*speedFactor*2*POS_SPEEDUP;
   const r = d.R0 + d.R1*Math.sin(simT*0.02 + d.phase*1.4);
   const p = metersToLatLon(CENTER.lat, CENTER.lon, r*Math.cos(d.angle), r*Math.sin(d.angle));
   const distMoved = haversineM(d.prevLat,d.prevLon,p.lat,p.lon);
   d.spd = (distMoved/(2*POS_SPEEDUP))*3.6;
   d.lat = p.lat; d.lon = p.lon;
   d.battery = Math.max(3, d.battery - 0.006);

   const isUp = d.connected(realT);
   if (isUp) {
     d.lastRxMs = Date.now();
     d.rssi = Math.round(d.rssiBase + (Math.random()*6-3));
     // "veritiero" come sul collare vero: il numero di satelliti arriva
     // sempre (anche senza fix), il fix scatta solo da una soglia in su.
     d.sats = Math.max(0, Math.round(d.satsBase + (Math.random()*3-1.5)));
     d.fix = d.sats >= 4;
     d.snr = Math.round((d.rssi+130)/8 + (Math.random()*2-1));
     // HDOP: piu' satelliti "buoni" -> geometria migliore -> HDOP piu' basso.
     if (d.fix) d.hdop = Math.max(0.6, 12 - d.sats*1.1 + (Math.random()*1-0.5));
     if (d.fix) d.alt = Math.round(d.altBase + (Math.random()*4-2));
     d.everSeen = true;
     // Ferma solo su Rex (indice 0), in una finestra deterministica, cosi'
     // nella demo si vede prima o poi lo stato "IN FERMA!" lampeggiante -
     // stessa flag del collare vero, qui pilotata a orologio invece che
     // da un vero accelerometro.
     if (i===0) { const c=realT%40; d.ferma = c>15 && c<25; }
     d.history.push({lat:d.lat, lon:d.lon});
     if (d.history.length>600) d.history.shift();
     d.recent.push({lat:d.lat, lon:d.lon});
     if (d.recent.length>80) d.recent.shift();
   }
 });
}

function buildData(){
 const dogs = dogsSim.map(d=>{
   const dist = haversineM(meSim.lat, meSim.lon, d.lat, d.lon);
   const brg  = bearingDeg(meSim.lat, meSim.lon, d.lat, d.lon);
   const ageS = Math.floor((Date.now()-d.lastRxMs)/1000);
   return {n:d.name, lat:d.lat, lon:d.lon, d:dist, b:brg, spd:d.spd, bt:Math.round(d.battery),
           mv: d.spd>1, ferma: d.ferma, age: ageS, rssi: d.rssi||-999, fix: d.fix, sats: d.sats,
           snr: d.snr, hdop: d.hdop, alt: d.alt, llat: d.lat, llon: d.lon};
 });
 // sf/pbat/cal: dati "di sistema" mostrati nel popup Info, non legati a un cane
 return {me:{lat:meSim.lat, lon:meSim.lon, head:meSim.head}, act:D.act||0, metric:cfg.metric,
         sf:8, pbat:76, cal:true, dogs};
}

// ===================== motore mappa offline (tile precaricate) ========
const DOG_COLORS = ['#3ba55d','#e5a53a','#5b9bd5'];
const Z = TILE_ZOOM;
const WORLD = 256*Math.pow(2,Z);
const mosaicOrigin = {x:(TILE_CX-1)*256, y:(TILE_CY-1)*256};
function project(lat,lon){
 const x=(lon+180)/360*WORLD;
 const latRad=lat*Math.PI/180;
 const y=(1-Math.log(Math.tan(latRad)+1/Math.cos(latRad))/Math.PI)/2*WORLD;
 return {x,y};
}
const cameraBase = project(CENTER.lat, CENTER.lon);
let camOffset = {x:0,y:0};
let vw=0, vh=0;
let curLayer = 'street';
const ATTRIB = {
 street:'© CARTO, © OpenStreetMap contributors',
 sat:'© Esri, Maxar, Earthstar Geographics',
 topo:'© OpenTopoMap (CC-BY-SA), © OpenStreetMap contributors'
};

function updateViewportSize(){
 const el=document.getElementById('map');
 vw=el.clientWidth; vh=el.clientHeight;
}
function worldToScreen(px,py){
 return {x: px-(cameraBase.x+camOffset.x)+vw/2, y: py-(cameraBase.y+camOffset.y)+vh/2};
}
function toScreen(lat,lon){ const p=project(lat,lon); return worldToScreen(p.x,p.y); }

function clampCamOffset(){
 const half = 384; // 768/2
 let minX = -half+vw/2, maxX = half-vw/2;
 let minY = -half+vh/2, maxY = half-vh/2;
 if (minX>maxX) { minX=maxX=0; }
 if (minY>maxY) { minY=maxY=0; }
 camOffset.x = Math.min(maxX, Math.max(minX, camOffset.x));
 camOffset.y = Math.min(maxY, Math.max(minY, camOffset.y));
}

function buildMosaic(layer){
 const mosaic = document.getElementById('mosaic');
 mosaic.innerHTML = '';
 (TILE_DATA[layer]||TILE_DATA.street).forEach(t=>{
  const img = document.createElement('img');
  img.src = t.uri;
  img.style.left = ((t.dx+1)*256)+'px';
  img.style.top  = ((t.dy+1)*256)+'px';
  mosaic.appendChild(img);
 });
 document.getElementById('mapAttrib').textContent = ATTRIB[layer]||'';
}
function switchLayer(name){
 curLayer = name;
 buildMosaic(name);
 renderMap();
}

function positionMosaic(){
 const mosaic = document.getElementById('mosaic');
 const p = worldToScreen(mosaicOrigin.x, mosaicOrigin.y);
 mosaic.style.left = p.x+'px';
 mosaic.style.top  = p.y+'px';
}

function svgEl(tag,attrs){
 const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
 for(const k in attrs) e.setAttribute(k,attrs[k]);
 return e;
}
function polylinePoints(pts){
 return pts.map(p=>{const s=toScreen(p.lat,p.lon);return s.x.toFixed(1)+','+s.y.toFixed(1);}).join(' ');
}

function renderMap(){
 updateViewportSize();
 clampCamOffset();
 positionMosaic();
 const overlay = document.getElementById('overlay');
 overlay.innerHTML='';
 overlay.setAttribute('viewBox','0 0 '+vw+' '+vh);

 // scie: dashed grigia (storico completo) solo per il cane attivo se Trail ON
 if (showTrail && D.act>=0 && D.act<dogsSim.length && dogsSim[D.act].history.length>1){
  overlay.appendChild(svgEl('polyline',{points:polylinePoints(dogsSim[D.act].history),
   fill:'none',stroke:'#9fb0c0',['stroke-width']:2,['stroke-dasharray']:'5,5',opacity:.6}));
 }
 // scia recente colorata per ogni cane
 dogsSim.forEach((d,i)=>{
  if(d.recent.length>1){
   overlay.appendChild(svgEl('polyline',{points:polylinePoints(d.recent),
    fill:'none',stroke:DOG_COLORS[i%DOG_COLORS.length],['stroke-width']:3,opacity:.75}));
  }
 });

 // marker "io"
 const mePos = toScreen(meSim.lat, meSim.lon);
 let mePin = document.getElementById('mePin');
 if(!mePin){
  mePin = document.createElement('div'); mePin.id='mePin'; mePin.className='mePin';
  mePin.innerHTML='<svg class="me-arrow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#2b8cff" fill-opacity="0.35"/><path d="M12 3 L18 18 L12 14 L6 18 Z" fill="#2b8cff" stroke="#fff" stroke-width="1"/></svg>';
  document.getElementById('map').appendChild(mePin);
 }
 mePin.style.left = mePos.x+'px'; mePin.style.top = mePos.y+'px';
 const arrowSvg = mePin.querySelector('.me-arrow');
 if (arrowSvg) arrowSvg.style.transform = 'rotate('+meSim.head+'deg)';

 // marker cani
 D.dogs.forEach((d,i)=>{
  const s = toScreen(d.lat, d.lon);
  let pin = document.getElementById('dogPin'+i);
  if(!pin){
   pin = document.createElement('div'); pin.id='dogPin'+i; pin.className='dogPin';
   document.getElementById('map').appendChild(pin);
  }
  pin.innerHTML = `<span class="lbl">${d.n}</span><span class="dot" style="background:${DOG_COLORS[i%DOG_COLORS.length]}"></span>`;
  pin.style.left = s.x+'px'; pin.style.top = s.y+'px';
 });
}

// drag-to-pan
(function initDrag(){
 const el = document.getElementById('map');
 let dragging=false, lastX=0, lastY=0;
 el.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;el.classList.add('dragging');el.setPointerCapture(e.pointerId);});
 el.addEventListener('pointermove',e=>{
  if(!dragging)return;
  camOffset.x -= (e.clientX-lastX); camOffset.y -= (e.clientY-lastY);
  lastX=e.clientX; lastY=e.clientY;
  renderMap();
 });
 function stop(e){dragging=false;el.classList.remove('dragging');}
 el.addEventListener('pointerup',stop); el.addEventListener('pointercancel',stop);
 window.addEventListener('resize',renderMap);
})();

// ===================== resto GUI (cards, impostazioni, tracce) ========
let D={dogs:[],me:null,act:0,metric:true};
let showTrail=false;
function fD(m){return D.metric?(m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km')
 :(m*3.281<5280?Math.round(m*3.281)+' ft':(m*3.281/5280).toFixed(2)+' mi');}
function sigBars(rssi){
 let n = rssi>-95?4 : rssi>-105?3 : rssi>-113?2 : rssi>-120?1 : 0;
 let out='<span class="sig">';
 for(let i=0;i<4;i++) out+=`<i class="${i<n?'on':''}" style="height:${4+i*3}px"></i>`;
 return out+'</span>';
}
// Icona satellite (SVG minimale: corpo + 2 pannelli) per il badge GPS.
const SAT_SVG = '<svg viewBox="0 0 20 20" width="11" height="11"><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="1" y="6" width="5" height="8" rx="1" fill="none" stroke-width="1.4"/><rect x="14" y="6" width="5" height="8" rx="1" fill="none" stroke-width="1.4"/><line x1="6" y1="9" x2="8" y2="9" stroke-width="1.4"/><line x1="12" y1="9" x2="14" y2="9" stroke-width="1.4"/></svg>';
function gpsBadge(d){
 // "veritiero": distingue fix valido, "vedo N satelliti ma niente fix
 // ancora" e "collare mai sentito" - non solo un si/no.
 let cls = d.fix ? 'gok' : (d.sats>0 ? 'gpart' : 'gbad');
 let txt = d.fix ? `${d.sats} sat` : (d.sats>0 ? `${d.sats} sat, no fix` : 'no GPS');
 return `<span class="gps ${cls}">${SAT_SVG}${txt}</span>`;
}
// Icona batteria (corpo + polo + livello) per il badge batteria, stesso
// stile grafico del gpsBadge/SAT_SVG qui sopra.
function battBadge(pct){
 let cls = pct<15?'bbad':pct<40?'bwarn':'bok';
 let fillW = Math.max(1, Math.round(Math.min(100,Math.max(0,pct))/100*10));
 let svg = `<svg viewBox="0 0 16 10" width="16" height="10">`+
   `<rect x="0.5" y="0.5" width="12" height="9" rx="1.5"/>`+
   `<rect x="13" y="3" width="1.5" height="4" rx="0.5"/>`+
   `<rect x="2" y="2" width="${fillW}" height="6" rx="0.5"/></svg>`;
 return `<span class="batt ${cls}">${svg}${Math.round(pct)}%</span>`;
}
// Stessi 3 stati della Home sul palmare (in movimento/in ferma/a riposo),
// dalle stesse flag mv/ferma del collare - non un'invenzione della web GUI.
function moveTxt(d){
 if(d.ferma) return '<span class="ferma">IN FERMA!</span>';
 if(d.mv) return d.spd>1?d.spd.toFixed(0)+' km/h':'In movimento';
 return 'A riposo';
}
function card(d,i){
 let ageTxt=d.age<8?'ora':d.age<60?d.age+'s fa':'PERSO '+Math.floor(d.age/60)+'m';
 let cls=d.age<15?'':d.age<60?'old':'lost';
 return `<div class="card ${i==D.act?'act':''}" data-idx="${i}">
  <div class="nm"><span class="bz ${d.mv?'mv':''}"></span>${d.n}
   <svg class="arrow" viewBox="0 0 20 20" style="transform:rotate(${d.b}deg)">
    <path d="M10 1 L16 17 L10 13 L4 17 Z" fill="#3ba55d"/></svg>
   ${sigBars(d.rssi)}
   <button class="infoBtn" onclick="event.stopPropagation();showDogInfo(${i})">i</button></div>
  <div class="dist">${d.d>=0?fD(d.d):'--'}</div>
  <div class="sub">${moveTxt(d)} · ${d.rssi}dBm</div>
  <div class="sub">${gpsBadge(d)} ${battBadge(d.bt)}</div>
  <div class="sub ${cls}">${ageTxt}</div></div>`;}

function selectDog(i){
 if(i===D.act)return;
 D.act=i;
 document.getElementById('cards').innerHTML=D.dogs.map(card).join('');
 renderMap();
}
document.getElementById('cards').addEventListener('click',e=>{
 let card=e.target.closest('.card');
 if(card)selectDog(parseInt(card.dataset.idx));
});

function upd(){
 stepSim();
 D = buildData();
 document.getElementById('st').textContent='● live (dati simulati)';
 document.getElementById('st').style.color='#3ba55d';
 document.getElementById('cards').innerHTML=D.dogs.map(card).join('');
 renderMap();
}

function fmtSt(st){if(!st)return 'sessione senza data';
 let d=new Date(st*1000);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}

let mockTracks=[
 {f:'trk_20260721_0917.trk', st: Math.floor(Date.now()/1000)-6*86400, pts: 842, dogs:['Rex']},
 {f:'trk_20260715_1834.trk', st: Math.floor(Date.now()/1000)-12*86400, pts: 1523, dogs:['Rex','Luna']},
 {f:'trk_20260702_0755.trk', st: Math.floor(Date.now()/1000)-25*86400, pts: 401, dogs:['Fido']},
];
function loadTracks(){
 let l=mockTracks.slice().sort((a,b)=>b.f.localeCompare(a.f));
 document.getElementById('trklist').innerHTML=l.length?l.map(t=>
  `<div class="trow"><div class="ti"><div>${fmtSt(t.st)}</div>
   <div class="td">${t.dogs.join(', ')} · ${t.pts} punti</div></div>
   <a href="#" onclick="downloadGpx('${t.f}');return false;">GPX</a>
   <button class="del" onclick="delTrk('${t.f}')">X</button></div>`).join('')
  :'<div class="td" style="padding:8px 0">nessuna traccia</div>';
}
function downloadGpx(f){
 let gpx=`<?xml version="1.0"?>\n<gpx version="1.1" creator="PiZaff-DogTrack-demo"><trk><name>${f}</name><trkseg>\n`+
  `<trkpt lat="${meSim.lat.toFixed(6)}" lon="${meSim.lon.toFixed(6)}"></trkpt>\n</trkseg></trk></gpx>`;
 let blob=new Blob([gpx],{type:'application/gpx+xml'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.replace('.trk','.gpx');
 document.body.appendChild(a);a.click();a.remove();
}
function delTrk(f){if(!confirm('Eliminare questa traccia?'))return;
 mockTracks=mockTracks.filter(t=>t.f!==f);loadTracks();}
document.getElementById('trk').addEventListener('toggle',e=>{if(e.target.open)loadTracks()});

document.getElementById('mapSelect').addEventListener('change',e=>switchLayer(e.target.value));

document.getElementById('trailBtn').addEventListener('click',()=>{
 showTrail=!showTrail;
 let btn=document.getElementById('trailBtn');
 btn.textContent=showTrail?'Trail ON':'Trail OFF';
 btn.style.background=showTrail?'#3ba55d':'#2a3542';
 renderMap();
});

function openModal(){
 document.getElementById('setMetric').value=cfg.metric?'1':'0';
 document.getElementById('setDecl').value=cfg.decl;
 document.getElementById('calibStatus').textContent='';
 document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function saveSettingsWeb(){
 cfg.metric=document.getElementById('setMetric').value==='1';
 cfg.decl=parseFloat(document.getElementById('setDecl').value)||0;
 D.metric=cfg.metric;closeModal();
}
function calibrateCompassWeb(){
 let st=document.getElementById('calibStatus');
 st.textContent='Calibrazione avviata: ruota il palmare a 8 in aria per 15s...';
 let left=17;
 let iv=setInterval(()=>{
  left--;
  st.textContent=left>0?`Calibrazione in corso... ${left}s`:'Fatto! Puoi chiudere.';
  if(left<=0)clearInterval(iv);
 },1000);
}
document.getElementById('settingsBtn').addEventListener('click',openModal);
document.getElementById('modalCancel').addEventListener('click',closeModal);
document.getElementById('modalSave').addEventListener('click',saveSettingsWeb);
document.getElementById('calibBtn').addEventListener('click',calibrateCompassWeb);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

// ---- Info cane: stessi dati della schermata "Info" sul palmare -------
function fmtCoord(lat,lon){
 if(lat===0&&lon===0) return 'n/d';
 return Math.abs(lat).toFixed(6)+(lat>=0?'N':'S')+' '+Math.abs(lon).toFixed(6)+(lon>=0?'E':'W');
}
function showDogInfo(i){
 let d=D.dogs[i];
 if(!d)return;
 let seen = d.rssi>-999;
 let hasPos = d.llat!==0||d.llon!==0;
 document.getElementById('infoModalTitle').textContent=d.n;
 document.getElementById('infoModalBody').innerHTML=
  `<div class="infoRow"><span>Spreading factor</span><span>SF${D.sf}</span></div>
   <div class="infoRow"><span>RSSI</span><span>${seen?d.rssi+' dBm':'n/d'}</span></div>
   <div class="infoRow"><span>SNR</span><span>${seen?d.snr.toFixed(1):'n/d'}</span></div>
   <div class="infoRow"><span>Bussola palmare</span><span>${D.cal?'calibrata':'da calibrare'}</span></div>
   <div class="infoRow"><span>Batteria palmare</span><span>${D.pbat}%</span></div>
   <div class="infoRow"><span>Batteria collare</span><span>${seen?d.bt+'%':'n/d'}</span></div>
   <div class="infoRow"><span>Ultima posizione</span><span>${fmtCoord(d.llat,d.llon)}</span></div>
   <div class="infoRow"><span>Altitudine</span><span>${hasPos?d.alt+' m':'n/d'}</span></div>
   <div class="infoRow"><span>HDOP</span><span>${hasPos?d.hdop.toFixed(1):'n/d'}</span></div>`;
 document.getElementById('infoModal').classList.add('show');
}
function closeInfoModal(){document.getElementById('infoModal').classList.remove('show');}
document.getElementById('infoModalClose').addEventListener('click',closeInfoModal);
document.getElementById('infoModal').addEventListener('click',e=>{if(e.target.id==='infoModal')closeInfoModal();});

stepSim();
D = buildData();
buildMosaic(curLayer);
requestAnimationFrame(()=>{ renderMap(); });
upd();
setInterval(upd,2000);
</script></body></html>
